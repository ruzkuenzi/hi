<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle Sphere Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #050508;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- Include Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Setup Scene, Camera, Renderer
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 6;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Particle Sphere Group
        const sphereGroup = new THREE.Group();
        scene.add(sphereGroup);

        const particleCount = 2500;
        const geometry = new THREE.BufferGeometry();
        const positions = [];
        const colors = [];
        const sizes = [];

        const radius = 2.0;
        const thickness = 0.5;
        const color = new THREE.Color();

        for (let i = 0; i < particleCount; i++) {
            const angle = (i / particleCount) * Math.PI * 2;
            const radiusVariation = radius + (Math.random() - 0.5) * thickness;
            
            const phi = Math.acos(-1 + (2 * i) / particleCount);
            const theta = Math.sqrt(particleCount * Math.PI) * phi;

            const x = radiusVariation * Math.cos(theta) * Math.sin(phi);
            const y = radiusVariation * Math.sin(theta) * Math.sin(phi);
            const z = radiusVariation * Math.cos(phi);

            positions.push(x, y, z);

            const hue = (i / particleCount) * 0.7 + 0.3;
            color.setHSL(hue, 1.0, 0.6);
            colors.push(color.r, color.g, color.b);
            
            sizes.push(Math.random() * 0.05 + 0.02);
        }

        geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
            size: 0.04,
            vertexColors: true,
            transparent: true,
            opacity: 0.85,
            blending: THREE.AdditiveBlending
        });

        const particleSphere = new THREE.Points(geometry, material);
        sphereGroup.add(particleSphere);

        // Add Rotating Orbit Rings
        const ringGeometry = new THREE.RingGeometry(2.6, 2.65, 64);
        const ringMaterial = new THREE.MeshBasicMaterial({ 
            color: 0x4facfe, 
            side: THREE.DoubleSide, 
            transparent: true, 
            opacity: 0.4,
            blending: THREE.AdditiveBlending
        });

        const ring1 = new THREE.Mesh(ringGeometry, ringMaterial);
        ring1.rotation.x = Math.PI / 3;
        sphereGroup.add(ring1);

        const ring2 = new THREE.Mesh(ringGeometry, ringMaterial.clone());
        ring2.material.color.setHex(0xff0844);
        ring2.rotation.y = Math.PI / 4;
        sphereGroup.add(ring2);

        // Mouse Interaction
        let mouseX = 0;
        let mouseY = 0;
        let targetX = 0;
        let targetY = 0;

        window.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX - window.innerWidth / 2) / 400;
            mouseY = (event.clientY - window.innerHeight / 2) / 400;
        });

        // ** ANIMATION LOOP **
        function animate() {
            requestAnimationFrame(animate);

            // Smooth interpolation (lerp) toward mouse coordinates
            targetX = mouseX;
            targetY = mouseY;

            sphereGroup.rotation.y += 0.004 + (targetX - sphereGroup.rotation.y) * 0.05;
            sphereGroup.rotation.x += (targetY - sphereGroup.rotation.x) * 0.05;

            // Rotate rings independently for complex motion
            ring1.rotation.z += 0.01;
            ring2.rotation.z -= 0.015;

            renderer.render(scene, camera);
        }

        animate();

        // Handle Window Resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
